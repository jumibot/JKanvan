<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JKanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          primary: '#F97316', 'primary-dark': '#EA580C',
          surface: '#080f1e', 's1': '#0d1829', 's2': '#111f35', 's3': '#1a2d4a',
          'on-s': '#f1f5f9', 'on-sm': '#94a3b8', 'on-sd': '#475569',
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      }}
    }
  </script>
  <style>
    *{box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#080f1e;color:#f1f5f9;margin:0}
    .ms{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:20px;line-height:1;user-select:none;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased}
    .ms-lg{font-size:28px}.ms-sm{font-size:16px}.ms-xs{font-size:13px}

    /* Glass */
    .glass{background:rgba(13,24,41,.88);backdrop-filter:blur(20px);border:1px solid rgba(249,115,22,.12)}
    .glass-card{background:rgba(17,31,53,.7);backdrop-filter:blur(12px);border:1px solid rgba(249,115,22,.09)}
    .glass-modal{background:rgba(6,12,24,.97);backdrop-filter:blur(28px);border:1px solid rgba(249,115,22,.18)}

    /* Buttons */
    .btn{border-radius:.75rem;padding:.5rem 1.125rem;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:all .18s;display:inline-flex;align-items:center;gap:.375rem}
    .btn-primary{background:linear-gradient(135deg,#F97316,#EA580C);color:#fff}
    .btn-primary:hover{background:linear-gradient(135deg,#FB923C,#F97316);transform:translateY(-1px);box-shadow:0 4px 18px rgba(249,115,22,.35)}
    .btn-ghost{background:transparent;color:#94a3b8;border:1px solid rgba(100,116,139,.28)}
    .btn-ghost:hover{color:#f1f5f9;border-color:rgba(249,115,22,.4);background:rgba(249,115,22,.08)}
    .btn-danger{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
    .btn-danger:hover{background:linear-gradient(135deg,#F87171,#EF4444);transform:translateY(-1px)}
    .btn-icon{background:transparent;border:none;cursor:pointer;padding:.375rem;border-radius:.5rem;color:#64748b;transition:all .15s}
    .btn-icon:hover{color:#f1f5f9;background:rgba(255,255,255,.06)}

    /* Inputs */
    .inp{background:rgba(17,31,53,.6);border:1px solid rgba(100,116,139,.22);border-radius:.75rem;color:#f1f5f9;padding:.6rem .85rem;font-size:.875rem;width:100%;outline:none;transition:border-color .18s;font-family:'Inter',sans-serif}
    .inp:focus{border-color:rgba(249,115,22,.5);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
    .inp::placeholder{color:#334155}
    .inp option{background:#0d1829;color:#f1f5f9}
    .lbl{font-size:.7rem;font-weight:600;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;display:block}

    /* Nav */
    .nav-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .75rem;border-radius:.6rem;color:#64748b;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .15s;user-select:none}
    .nav-item:hover{background:rgba(249,115,22,.1);color:#f1f5f9}
    .nav-item.active{background:rgba(249,115,22,.14);color:#F97316}

    /* Cards */
    .proj-card{transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer}
    .proj-card:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.4);border-color:rgba(249,115,22,.32)!important}
    .task-card{transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
    .task-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.35);border-color:rgba(249,115,22,.28)!important}

    /* Progress */
    .prog-track{background:rgba(100,116,139,.18);border-radius:9999px;height:3px;overflow:hidden}
    .prog-fill{height:100%;border-radius:9999px;background:linear-gradient(90deg,#F97316,#FB923C);transition:width .3s}

    /* Tags */
    .tag-chip{display:inline-flex;align-items:center;gap:.2rem;padding:.1rem .45rem;border-radius:9999px;font-size:.62rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

    /* Scrollbar */
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(100,116,139,.35);border-radius:10px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(249,115,22,.5)}

    /* Modal */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
    .modal-bg.open{opacity:1;pointer-events:all}
    .modal-box{transform:scale(.95) translateY(12px);transition:transform .22s}
    .modal-bg.open .modal-box{transform:scale(1) translateY(0)}

    /* Color picker */
    .cswatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
    .cswatch:hover{transform:scale(1.18)}
    .cswatch.on{border-color:#fff;box-shadow:0 0 0 3px rgba(249,115,22,.5)}

    /* Icon picker */
    .iopt{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:.5rem;cursor:pointer;color:#64748b;border:1px solid transparent;transition:all .15s;flex-shrink:0}
    .iopt:hover{background:rgba(249,115,22,.1);color:#F97316}
    .iopt.on{background:rgba(249,115,22,.18);color:#F97316;border-color:rgba(249,115,22,.35)}

    /* Toast */
    #toasts{position:fixed;bottom:1.5rem;right:1.5rem;z-index:500;display:flex;flex-direction:column;gap:.45rem;pointer-events:none}
    .toast{padding:.65rem 1rem;border-radius:.75rem;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:.45rem;animation:slideIn .25s ease;pointer-events:none}
    .toast-ok{background:rgba(16,185,129,.13);border:1px solid rgba(16,185,129,.28);color:#6ee7b7}
    .toast-err{background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.28);color:#fca5a5}
    @keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

    /* Spinner */
    .spin{width:22px;height:22px;border:2px solid rgba(249,115,22,.25);border-top-color:#F97316;border-radius:50%;animation:rot .75s linear infinite}

    /* Drag and drop */
    .task-card.dragging{opacity:.35;pointer-events:none}
    .col-drop-active{background:rgba(249,115,22,.07)!important;outline:2px dashed rgba(249,115,22,.45);outline-offset:-2px;border-radius:.75rem}
    .task-card.drop-before{border-top:2px solid #F97316!important}
    .task-card.drop-after{border-bottom:2px solid #F97316!important}
    .k-col.col-reorder-before{box-shadow:-3px 0 0 0 #F97316}
    .k-col.col-reorder-after{box-shadow:3px 0 0 0 #F97316}
    .k-col-header{cursor:grab}.k-col-header:active{cursor:grabbing}
    .k-col-header.col-dragging{opacity:.45}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* Completed task */
    .done .task-title{text-decoration:line-through;opacity:.45}
    .done{opacity:.7}

    /* Kanban */
    .k-col{width:296px;flex-shrink:0}
    .k-col-body{background:rgba(10,19,39,.92)!important;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.05)}

    /* Wide modal (task editor) */
    .modal-box.modal-lg{max-width:52rem!important}

    /* Task editor metadata rows */
    .meta-row{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;border-radius:.65rem;background:rgba(10,19,39,.55);border:1px solid rgba(51,65,85,.15)}
    .meta-label{font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.1em;flex-shrink:0;white-space:nowrap}
    .meta-select,.meta-input{background:transparent;border:none;outline:none;text-align:right;font-size:.8rem;font-weight:600;color:#f1f5f9;cursor:pointer;font-family:inherit}
    .meta-select option{background:#0d1829;color:#f1f5f9}
    .meta-input[type="number"]{max-width:5rem}
    .meta-input[type="datetime-local"]{max-width:13rem;color-scheme:dark}

    /* Auth wall */
    #auth-wall{position:fixed;inset:0;background:#080f1e;z-index:400;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>

<!-- AUTH WALL -->
<div id="auth-wall">
  <div class="glass-modal rounded-2xl w-full max-w-sm mx-4 p-8">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#F97316,#EA580C)">
        <span class="ms text-white" style="font-size:20px">bolt</span>
      </div>
      <div>
        <div class="text-lg font-bold text-white">JKanban</div>
        <div class="text-xs text-slate-600">Precision Workflow</div>
      </div>
    </div>

    <!-- Error display -->
    <div id="aw-err" style="display:none" class="mb-4 px-3 py-2.5 rounded-xl text-sm" style="background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.28);color:#fca5a5"></div>

    <!-- Login form -->
    <div id="aw-login">
      <div class="text-base font-bold text-white mb-1">Iniciar sesión</div>
      <div class="text-xs text-slate-500 mb-6">Accede a tu espacio de trabajo</div>
      <form onsubmit="doLogin(event)">
        <div class="mb-3">
          <label class="lbl">Email</label>
          <input id="aw-email" type="email" class="inp" placeholder="tu@email.com" required>
        </div>
        <div class="mb-5">
          <label class="lbl">Contraseña</label>
          <input id="aw-pass" type="password" class="inp" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-full justify-center py-2.5 text-sm">Entrar</button>
      </form>
      <div class="text-center mt-5 text-xs text-slate-600">
        ¿Sin cuenta?
        <span class="text-primary cursor-pointer hover:underline" onclick="awToggle(true)">Regístrate</span>
      </div>
    </div>

    <!-- Register form -->
    <div id="aw-register" style="display:none">
      <div class="text-base font-bold text-white mb-1">Crear cuenta</div>
      <div class="text-xs text-slate-500 mb-6">Únete al espacio de trabajo</div>
      <form onsubmit="doRegister(event)">
        <div class="mb-3">
          <label class="lbl">Nombre</label>
          <input id="aw-rname" class="inp" placeholder="Alice Martín" required>
        </div>
        <div class="mb-3">
          <label class="lbl">Email</label>
          <input id="aw-remail" type="email" class="inp" placeholder="tu@email.com" required>
        </div>
        <div class="mb-5">
          <label class="lbl">Contraseña</label>
          <input id="aw-rpass" type="password" class="inp" placeholder="mín. 6 caracteres" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-full justify-center py-2.5 text-sm">Registrarse</button>
      </form>
      <div class="text-center mt-5 text-xs text-slate-600">
        ¿Ya tienes cuenta?
        <span class="text-primary cursor-pointer hover:underline" onclick="awToggle(false)">Iniciar sesión</span>
      </div>
    </div>
  </div>
</div>

<div id="app" class="flex h-screen overflow-hidden" style="display:none!important">

  <!-- SIDEBAR -->
  <aside id="sb" class="w-56 flex-shrink-0 flex flex-col py-5 px-3 overflow-y-auto" style="background:linear-gradient(180deg,#161e2e 0%,#0f1729 100%);box-shadow:2px 0 24px rgba(0,0,0,.35)">
    <div class="flex items-center gap-2 px-2 mb-7">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#F97316,#EA580C)">
        <span class="ms text-white" style="font-size:17px">bolt</span>
      </div>
      <div>
        <div class="text-sm font-bold text-white">JKanban</div>
        <div class="text-xs text-slate-600 -mt-0.5">Precision Workflow</div>
      </div>
    </div>
    <div id="sb-nav" class="flex flex-col gap-0.5 flex-1"></div>
    <div id="sb-actions" class="mt-4 flex flex-col gap-2"></div>
    <div id="sb-user"></div>
    <div class="pt-3 border-t" style="border-color:rgba(255,255,255,.05)">
      <div class="nav-item" style="color:#f87171" onclick="doLogout()" onmouseenter="this.style.background='rgba(239,68,68,.08)'" onmouseleave="this.style.background=''">
        <span class="ms ms-sm">logout</span>Cerrar sesión
      </div>
    </div>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header id="hdr" class="h-14 flex items-center justify-between px-6 border-b flex-shrink-0" style="background:#070e1c;border-color:rgba(255,255,255,.05)">
      <div id="hdr-bc" class="flex items-center gap-1.5 text-sm text-slate-500"></div>
      <div id="hdr-act" class="flex items-center gap-2.5"></div>
    </header>
    <main id="content" class="flex-1 overflow-auto">
      <div class="flex items-center justify-center h-full"><div class="spin"></div></div>
    </main>
  </div>
</div>

<!-- MODAL -->
<div id="modal-bg" class="modal-bg" onclick="bgClose(event)">
  <div class="modal-box glass-modal rounded-2xl w-full max-w-lg mx-4 p-6 relative" style="max-height:90vh;overflow-y:auto">
    <div id="modal-inner"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
const S = {
  projects:[], groups:[], tasks:[], users:[], tags:[], priorities:[], members:[],
  view:'dashboard', pid:null, subview:'kanban',
  currentUser: null,
};

// ═══════════════════════════════════
// AUTH
// ═══════════════════════════════════
const _TK = 'jk_token', _UK = 'jk_user';

function getToken() { return localStorage.getItem(_TK); }

function saveAuth(token, user) {
  localStorage.setItem(_TK, token);
  localStorage.setItem(_UK, JSON.stringify(user));
  S.currentUser = user;
}

function clearAuth() {
  localStorage.removeItem(_TK);
  localStorage.removeItem(_UK);
  S.currentUser = null;
}

function loadStoredUser() {
  try {
    const u = localStorage.getItem(_UK);
    if (u) S.currentUser = JSON.parse(u);
  } catch(_) {}
}

function showApp() {
  document.getElementById('auth-wall').style.display = 'none';
  document.getElementById('app').style.removeProperty('display');
}

function showAuthWall() {
  document.getElementById('app').style.setProperty('display','none','important');
  document.getElementById('auth-wall').style.display = 'flex';
}

function awToggle(showRegister) {
  document.getElementById('aw-login').style.display    = showRegister ? 'none' : '';
  document.getElementById('aw-register').style.display = showRegister ? '' : 'none';
  awErr('');
}

function awErr(msg) {
  const el = document.getElementById('aw-err');
  if (!msg) { el.style.display='none'; return; }
  el.style.display = '';
  el.style.background = 'rgba(239,68,68,.13)';
  el.style.border = '1px solid rgba(239,68,68,.28)';
  el.style.color = '#fca5a5';
  el.style.padding = '.6rem .85rem';
  el.style.borderRadius = '.75rem';
  el.style.fontSize = '.82rem';
  el.textContent = msg;
}

async function doLogin(e) {
  e.preventDefault();
  awErr('');
  const email    = document.getElementById('aw-email').value;
  const password = document.getElementById('aw-pass').value;
  try {
    const d = await fetch('/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
    });
    const body = await d.json();
    if (!d.ok) throw new Error(body.detail || 'Credenciales incorrectas');
    saveAuth(body.access_token, body.user);
    showApp();
    await loadAll();
    await route();
  } catch(err) { awErr(err.message); }
}

async function doRegister(e) {
  e.preventDefault();
  awErr('');
  const name     = document.getElementById('aw-rname').value;
  const email    = document.getElementById('aw-remail').value;
  const password = document.getElementById('aw-rpass').value;
  try {
    const d = await fetch('/users/', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, email, password}),
    });
    const body = await d.json();
    if (!d.ok) throw new Error(Array.isArray(body.detail) ? body.detail[0]?.msg : (body.detail || 'Error al registrarse'));
    // Auto-login after register
    const d2 = await fetch('/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
    });
    const body2 = await d2.json();
    if (!d2.ok) throw new Error(body2.detail || 'Error al iniciar sesión');
    saveAuth(body2.access_token, body2.user);
    showApp();
    await loadAll();
    await route();
  } catch(err) { awErr(err.message); }
}

function doLogout() {
  clearAuth();
  showAuthWall();
  // Reset state
  S.projects=[]; S.groups=[]; S.tasks=[]; S.users=[]; S.tags=[]; S.priorities=[];
  S.view='dashboard'; S.pid=null; location.hash='#/';
}

// ═══════════════════════════════════
// API
// ═══════════════════════════════════
async function req(method, path, body) {
  const o = {method, headers:{}};
  const token = getToken();
  if (token) o.headers['Authorization'] = `Bearer ${token}`;
  if (body !== undefined) { o.headers['Content-Type']='application/json'; o.body=JSON.stringify(body); }
  const r = await fetch(path, o);
  if (r.status === 401) {
    clearAuth(); showAuthWall();
    throw new Error('Sesión expirada. Por favor inicia sesión de nuevo.');
  }
  if (r.status === 204) return null;
  const d = await r.json();
  if (!r.ok) throw new Error(d.detail || 'Error en el servidor');
  return d;
}
const GET  = p      => req('GET',    p);
const POST = (p,b)  => req('POST',   p, b);
const PATCH= (p,b)  => req('PATCH',  p, b);
const DEL  = p      => req('DELETE', p);

async function loadAll() {
  [S.projects, S.groups, S.tasks, S.users] = await Promise.all([
    GET('/projects/'), GET('/groups/'), GET('/tasks/'), GET('/users/'),
  ]);
  // Tags and priorities are project-scoped — reload them when inside a board
  if (S.pid) {
    const [tags, priorities] = await Promise.all([
      GET(`/projects/${S.pid}/tags/`).catch(() => []),
      GET(`/projects/${S.pid}/priorities/`).catch(() => []),
    ]);
    S.tags = tags;
    S.priorities = priorities;
  } else {
    S.tags = [];
    S.priorities = [];
  }
}

async function loadMembers() {
  S.members = S.pid ? await GET(`/projects/${S.pid}/members`).catch(() => []) : [];
}

// ═══════════════════════════════════
// ROUTER
// ═══════════════════════════════════
function go(hash) { location.hash = hash; }

async function route() {
  const h = location.hash || '#/';
  if (h === '#/team') {
    if (!S.currentUser?.is_admin) { go('#/'); return; }
    S.view='team'; S.pid=null; S.tags=[]; S.priorities=[]; S.members=[]; S.subview='kanban';
  } else if (h.startsWith('#/board/')) {
    const parts = h.split('/');
    const newPid = parseInt(parts[2]);
    const sub = parts[3] || 'kanban';
    if (newPid !== S.pid) {
      S.pid = newPid;
      const [tags, priorities] = await Promise.all([
        GET(`/projects/${S.pid}/tags/`).catch(() => []),
        GET(`/projects/${S.pid}/priorities/`).catch(() => []),
      ]);
      S.tags = tags;
      S.priorities = priorities;
    }
    S.subview = sub;
    S.view = 'board';
    if (sub === 'team') await loadMembers();
  } else { S.view='dashboard'; S.pid=null; S.tags=[]; S.priorities=[]; S.members=[]; S.subview='kanban'; }
  render();
}

window.addEventListener('hashchange', route);

// ═══════════════════════════════════
// RENDER
// ═══════════════════════════════════
function render() { renderSidebar(); renderHeader(); renderContent(); }

// ── Sidebar ──────────────────────
function renderSidebar() {
  const nav  = document.getElementById('sb-nav');
  const acts = document.getElementById('sb-actions');
  const ubox = document.getElementById('sb-user');
  const v = S.view;
  const isAdmin = !!(S.currentUser && S.currentUser.is_admin);
  const adminLink = isAdmin
    ? '<div class="nav-item' + (v==='team' ? ' active' : '') + '" onclick="go(\'#/team\')"><span class="ms ms-sm">manage_accounts</span>Usuarios</div>'
    : '';

  if (v === 'board' && S.pid) {
    const p = S.projects.find(x => x.id === S.pid);
    const sub = S.subview;
    nav.innerHTML = `
      <div class="px-2 mb-4">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${p?.color||'#3B82F6'}1a;border:1px solid ${p?.color||'#3B82F6'}2a">
            <span class="ms" style="font-size:17px;color:${p?.color||'#3B82F6'}">${p?.icon||'folder'}</span>
          </div>
          <div class="min-w-0">
            <div class="text-sm font-semibold text-white truncate">${esc(p?.name||'')}</div>
            ${p?.priority ? `<div class="text-xs font-medium" style="color:${p.priority.color}">${esc(p.priority.name)}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="text-xs font-semibold text-slate-700 uppercase px-2 mb-1 tracking-wider">Proyecto</div>
      <div class="nav-item ${sub==='kanban'?'active':''}" onclick="go('#/board/${S.pid}')"><span class="ms ms-sm">view_kanban</span>Grupos de tareas</div>

// ── Header ───────────────────────
function renderHeader() {
  const bc  = document.getElementById('hdr-bc');
  const act = document.getElementById('hdr-act');
  const v = S.view;
  if (v==='board') {
    const p = S.projects.find(x => x.id === S.pid);
    const subLabels = { tags:'Etiquetas', priorities:'Prioridades', team:'Equipo' };
    const subLabel = subLabels[S.subview];
    bc.innerHTML = `<span class="cursor-pointer hover:text-primary transition-colors" onclick="go('#/')">Proyectos</span>
      <span class="ms ms-xs text-slate-700">chevron_right</span>
      ${subLabel
        ? `<span class="cursor-pointer hover:text-primary transition-colors" onclick="go('#/board/${S.pid}')">${esc(p?.name||'')}</span>
           <span class="ms ms-xs text-slate-700">chevron_right</span>
           <span class="text-white font-medium">${subLabel}</span>`
        : `<span class="text-white font-medium">${esc(p?.name||'')}</span>`}`;
    act.innerHTML = '';
  } else if (v==='dashboard') {
    bc.innerHTML = `<span class="text-white font-semibold">Proyectos</span>`;
    act.innerHTML = '';
  } else if (v==='team') {
    bc.innerHTML = `<span class="text-white font-semibold">Usuarios</span>`;
    act.innerHTML = '';
  }
}

// ── Content ───────────────────────
function renderContent() {
  const c = document.getElementById('content');
  if (S.view==='dashboard') c.innerHTML = vDashboard();
  else if (S.view==='board') {
    if      (S.subview==='tags')       c.innerHTML = vProjectTags();
    else if (S.subview==='priorities') c.innerHTML = vProjectPriorities();
    else if (S.subview==='team')       c.innerHTML = vProjectTeam();
    else                               c.innerHTML = vBoard();
  }
  else if (S.view==='team') c.innerHTML = vTeam();
}

function projCard(p) {
  const grps  = S.groups.filter(g => g.project_id === p.id);
  const tasks = S.tasks.filter(t => grps.some(g => g.id === t.group_id));
  const done  = tasks.filter(t => t.completed).length;
  const pct   = tasks.length ? Math.round(done/tasks.length*100) : 0;
  return `
    <div class="proj-card glass-card rounded-2xl p-5" onclick="go('#/board/${p.id}')">
      <div class="flex items-start justify-between mb-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${p.color}1a;border:1px solid ${p.color}28">
          <span class="ms" style="color:${p.color};font-size:20px">${p.icon}</span>
        </div>
        <div class="flex items-center gap-1.5">
          ${p.priority ? `<span class="tag-chip" style="background:${p.priority.color}22;color:${p.priority.color}">
            <span class="ms" style="font-size:10px">${p.priority.icon}</span>${esc(p.priority.name)}</span>` : ''}
          <button class="btn-icon" onclick="event.stopPropagation();mProjectMenu(${p.id})">
            <span class="ms ms-sm">more_horiz</span>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-1.5 mb-1">
        <h3 class="text-sm font-semibold text-white">${esc(p.name)}</h3>
        <button class="btn-icon p-0.5" onclick="event.stopPropagation();mProject(${p.id})" title="Editar proyecto"><span class="ms ms-xs">edit</span></button>
      </div>
      ${p.description ? `<p class="text-xs text-slate-500 mb-3 line-clamp-2">${esc(p.description)}</p>` : '<div class="mb-3"></div>'}
      <div class="prog-track mb-1.5"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="flex items-center justify-between">
        <div class="text-xs text-slate-600">${done}/${tasks.length} tareas</div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-700">${grps.length} col</span>
          ${p.members.length ? `<div class="flex -space-x-1">${p.members.slice(0,3).map(m=>avatar(m,'sm')).join('')}${p.members.length>3?`<div style="width:22px;height:22px;border-radius:50%;background:rgba(249,115,22,.2);border:1.5px solid rgba(249,115,22,.3);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#F97316">+${p.members.length-3}</div>`:''}</div>` : ''}
          ${p.leader ? avatar(p.leader,'sm') : ''}
        </div>
      </div>
    </div>`;
}

// ── Board ─────────────────────────
function vBoard() {
  const cols = S.groups.filter(g => g.project_id === S.pid).sort((a,b) => (a.sort_order??0)-(b.sort_order??0)||a.id-b.id);

    <div class="flex flex-col items-center justify-center h-full text-center px-4">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-4" style="background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.14)">
        <span class="ms" style="font-size:30px;color:#F97316">view_kanban</span>
      </div>
      <h2 class="text-xl font-bold text-white mb-2">Sin grupos de tareas</h2>

      <button class="btn btn-primary" onclick="mGroup()"><span class="ms ms-sm">add</span>Añadir grupo de tareas</button>
    </div>`;

  return `<div class="flex gap-4 p-5 overflow-x-auto h-full items-start pb-10">
    ${cols.map(kanbanCol).join('')}
    <div class="k-col flex-shrink-0">
      <button class="w-full glass-card rounded-2xl p-4 flex items-center gap-2 text-slate-600 hover:text-primary hover:border-primary/25 transition-all text-sm font-medium" onclick="mGroup()">
        <span class="ms ms-sm">add</span>Añadir grupo de tareas
      </button>
    </div>
  </div>`;
}

function kanbanCol(g) {
  const tasks = S.tasks.filter(t => t.group_id === g.id).sort((a,b) => (a.sort_order??0)-(b.sort_order??0)||a.id-b.id);
  return `<div class="k-col"
               ondragover="onColReorderDragOver(event,${g.id})"
               ondragleave="onColReorderDragLeave(event,${g.id})"
               ondrop="onColReorderDrop(event,${g.id})">
    <div class="glass-card k-col-body rounded-2xl overflow-hidden">
      <div class="k-col-header px-4 py-3 flex items-center justify-between select-none" style="background:${g.color}14"
           draggable="true"
           ondragstart="onColHeaderDragStart(event,${g.id})"
           ondragend="onColHeaderDragEnd(event)">
        <div class="flex items-center gap-2 min-w-0">
          <span class="ms ms-xs text-slate-600" style="font-size:14px">drag_indicator</span>
          <div class="w-2 h-2 rounded-full flex-shrink-0" style="background:${g.color}"></div>
          <span class="text-sm font-semibold text-white truncate">${esc(g.name)}</span>
          <span class="text-xs px-1.5 py-0.5 rounded-full font-semibold flex-shrink-0" style="background:${g.color}22;color:${g.color}">${tasks.length}</span>
          <button class="btn-icon p-0.5 flex-shrink-0" draggable="false" onclick="event.stopPropagation();mGroup(${g.id})" title="Editar grupo"><span class="ms ms-xs">edit</span></button>
        </div>
        <div class="flex items-center gap-0.5 flex-shrink-0">
          <button class="btn-icon" draggable="false" onclick="event.stopPropagation();mTask(null,${g.id})" title="Añadir tarea"><span class="ms ms-sm">add</span></button>
          <button class="btn-icon" draggable="false" onclick="event.stopPropagation();mColMenu(${g.id})"><span class="ms ms-sm">more_horiz</span></button>
        </div>
      </div>
      <div class="p-2.5 flex flex-col gap-2.5" id="col-${g.id}"
           ondragover="onColDragOver(event,${g.id})"
           ondragleave="onColDragLeave(event,${g.id})"
           ondrop="onColDrop(event,${g.id})">
        ${tasks.map(taskCard).join('')}
      </div>
      <div class="px-3 pb-3">
        <button class="w-full text-left text-xs text-slate-700 hover:text-slate-400 py-2 px-2.5 rounded-xl hover:bg-white/5 transition-all flex items-center gap-1.5" onclick="mTask(null,${g.id})">
          <span class="ms ms-xs">add</span>Añadir tarea
        </button>
      </div>
    </div>
  </div>`;
}

function taskCard(t) {
  const todoPct = t.todos_total ? (t.todos_completed/t.todos_total*100) : 0;
  return `
    <div class="task-card rounded-xl p-3 ${t.completed?'done':''}" style="background:rgba(26,37,63,.9);border:1px solid rgba(249,115,22,.1)"
         draggable="true"
         ondragstart="onTaskDragStart(event,${t.id},${t.group_id})"
         ondragend="onTaskDragEnd(event)"
         ondragover="onCardDragOver(event,${t.id})"
         ondragleave="onCardDragLeave(event,${t.id})"
         onclick="mTask(${t.id},${t.group_id})">
      ${t.tags.length ? `<div class="flex flex-wrap gap-1 mb-2">${t.tags.map(tg=>`<span class="tag-chip" style="background:${tg.color}20;color:${tg.color}">${esc(tg.name)}</span>`).join('')}</div>` : ''}
      <div class="flex items-start gap-1">
        <div class="task-title text-sm font-medium text-white leading-snug flex-1">${esc(t.title)}</div>
        <span class="ms ms-xs text-slate-500 flex-shrink-0 mt-0.5">edit</span>
      </div>
      ${t.description ? `<div class="text-xs text-slate-500 mt-1 line-clamp-2">${esc(t.description)}</div>` : ''}
      ${t.priority ? `<div class="flex items-center gap-1 mt-1.5">
        <span class="ms ms-xs" style="color:${t.priority.color}">${t.priority.icon}</span>
        <span class="text-xs" style="color:${t.priority.color}">${esc(t.priority.name)}</span>
      </div>` : ''}
      ${t.todos_total ? `<div class="mt-2">
        <div class="flex justify-between text-xs text-slate-700 mb-1"><span>Subtareas</span><span>${t.todos_completed}/${t.todos_total}</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${todoPct}%"></div></div>
      </div>` : ''}
      <div class="flex items-center justify-between mt-2.5">
        <div class="flex items-center gap-1.5">
          ${t.user ? avatar(t.user,'sm') : ''}
          ${t.estimated_duration ? `<span class="text-xs text-slate-700">${t.estimated_duration}h</span>` : ''}
        </div>
        ${t.completed ? `<span class="ms ms-sm" style="color:#10B981">check_circle</span>` : ''}
      </div>
    </div>`;
}

  const roleCard = (user, role, roleColor) => `
    <div class="glass-card rounded-2xl p-4 flex items-center justify-between" style="border-color:${roleColor}28">
      <div class="flex items-center gap-3">
        ${avatar(user)}
        <div class="min-w-0">
          <div class="text-sm font-medium text-white truncate">${esc(user.name)}</div>
          <div class="text-xs text-slate-500 truncate">${esc(user.email)}</div>
        </div>
      </div>
      <span class="text-xs px-2 py-0.5 rounded-full font-semibold flex-shrink-0" style="background:${roleColor}18;color:${roleColor}">${role}</span>
    </div>`;

  return `<div class="p-6 space-y-6">
    <div>
      <div class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-3">Propietario</div>

// ═══════════════════════════════════
// MODAL SYSTEM
// ═══════════════════════════════════
const COLS = ['#F97316','#EF4444','#F59E0B','#10B981','#3B82F6','#8B5CF6','#EC4899','#14B8A6','#6366F1','#6B7280'];
const ICNS = ['rocket_launch','code','folder','settings','hub','layers','memory','terminal','cloud','storage',
              'lock','security','bug_report','build','star','science','psychology','bolt','diamond','flag',
              'emergency','arrow_upward','arrow_downward','remove','priority_high'];

function swatches(sel, nm) {
  return `<div class="flex flex-wrap gap-2">${COLS.map(c=>`<div class="cswatch ${c===sel?'on':''}" style="background:${c}" data-c="${c}" onclick="pickColor(this,'${nm}')"></div>`).join('')}</div>`;
}
function iconGrid(sel, nm) {
  return `<div class="flex flex-wrap gap-1">${ICNS.map(ic=>`<div class="iopt ${ic===sel?'on':''}" data-ic="${ic}" onclick="pickIcon(this,'${nm}')"><span class="ms" style="font-size:17px">${ic}</span></div>`).join('')}</div>`;
}
function pickColor(el, nm) {
  el.closest('.flex').querySelectorAll('.cswatch').forEach(s=>s.classList.remove('on'));
  el.classList.add('on');
  fld(nm).value = el.dataset.c;
}
function pickIcon(el, nm) {
  el.closest('.flex').querySelectorAll('.iopt').forEach(s=>s.classList.remove('on'));
  el.classList.add('on');
  fld(nm).value = el.dataset.ic;
}
function fld(nm) {
  return document.getElementById('modal-inner').querySelector(`[name="${nm}"]`);
}

function showModal(html) {
  document.getElementById('modal-inner').innerHTML = html;
  document.getElementById('modal-bg').classList.add('open');
}
function closeM() {
  document.getElementById('modal-bg').classList.remove('open');
  document.querySelector('.modal-box').classList.remove('modal-lg');
}
function bgClose(e) { if (e.target===document.getElementById('modal-bg')) closeM(); }

function mhdr(title, sub) {
  return `<div class="-mx-6 -mt-6 px-6 py-4 mb-5 rounded-t-2xl flex items-start justify-between" style="background:linear-gradient(135deg,rgba(249,115,22,.13) 0%,rgba(13,24,41,.4) 100%);border-bottom:1px solid rgba(249,115,22,.15)">
    <div>
      <h2 class="text-base font-bold text-white">${title}</h2>
      ${sub?`<p class="text-xs text-slate-500 mt-0.5">${sub}</p>`:''}
    </div>
    <button class="btn-icon -mt-1 -mr-2" onclick="closeM()"><span class="ms ms-sm">close</span></button>
  </div>`;
}
function mfoot(saveLabel, showDanger, dangerFn) {
  return `<div class="flex gap-2.5 justify-end mt-5">
    ${showDanger?`<button type="button" class="btn btn-danger mr-auto" onclick="${dangerFn}">Eliminar</button>`:''}
    <button type="button" class="btn btn-ghost" onclick="closeM()">Cancelar</button>
    <button type="submit" class="btn btn-primary">${saveLabel}</button>
  </div>`;
}

async function saveProject(e, id) {
  e.preventDefault();
  const f = e.target;
  const b = {

    priority_id: f.priority_id.value ? +f.priority_id.value : null,
  };
  try {
    id ? await PATCH(`/projects/${id}`,b) : await POST('/projects/',b);
    closeM(); await loadAll(); render(); toast(id?'Proyecto actualizado':'Proyecto creado');
  } catch(err) { toast(err.message,'err'); }
}

async function addMember(projId, userId) {
  if (!userId) return;
  try {
    await POST(`/projects/${projId}/members/${userId}`);
    await Promise.all([loadAll(), loadMembers()]);
    render(); toast('Miembro añadido');
  } catch(err) { toast(err.message,'err'); }
}

async function removeMember(projId, userId) {
  try {
    await DEL(`/projects/${projId}/members/${userId}`);
    await Promise.all([loadAll(), loadMembers()]);
    render(); toast('Miembro eliminado');
  } catch(err) { toast(err.message,'err'); }
}

function toggleTTag(tagId) {
  const pickerOpen = document.getElementById('ttag-picker')?.style.display !== 'none';
  const inp = document.getElementById('tid-inp');
  let ids = inp.value ? inp.value.split(',').map(Number).filter(Boolean) : [];
  if (ids.includes(tagId)) ids = ids.filter(x => x !== tagId); else ids.push(tagId);
  inp.value = ids.join(',');
  renderTTagSection();
  if (pickerOpen) {
    const p = document.getElementById('ttag-picker');
    if (p) p.style.display = 'block';
  }
}

async function saveTask(e, id) {
  e.preventDefault();
  const f = e.target;
  const newTagIds = f.tag_ids.value ? f.tag_ids.value.split(',').map(Number).filter(Boolean) : [];
  const b = {
    title: f.title.value, description: f.description.value||null,
    group_id: +f.group_id.value,
    priority_id: f.priority_id.value ? +f.priority_id.value : null,
    user_id: f.user_id.value ? +f.user_id.value : null,
    estimated_duration: f.estimated_duration.value ? parseFloat(f.estimated_duration.value) : null,
    estimated_start: f.estimated_start.value||null,
    estimated_end: f.estimated_end.value||null,
    completed: f.completed.checked,
  };
  try {
    const saved = id ? await PATCH(`/tasks/${id}`,b) : await POST('/tasks/',b);
    const existIds = id ? (S.tasks.find(t=>t.id===id)?.tags?.map(t=>t.id)||[]) : [];
    const toAdd = newTagIds.filter(x=>!existIds.includes(x));
    const toDel = existIds.filter(x=>!newTagIds.includes(x));
    await Promise.all([
      ...toAdd.map(tid=>req('POST',`/tasks/${saved.id}/tags/${tid}`)),
      ...toDel.map(tid=>req('DELETE',`/tasks/${saved.id}/tags/${tid}`)),
    ]);
    closeM(); await loadAll(); render(); toast(id?'Tarea actualizada':'Tarea creada');
  } catch(err) { toast(err.message,'err'); }
}

async function loadTodos(taskId) {
  try {
    const todos = await GET(`/tasks/${taskId}/todos`);
    renderTodos(taskId, todos);
  } catch(e) {}
}

function renderTodos(taskId, todos) {
  const el = document.getElementById('todos-list');
  if (!el) return;
  if (!todos.length) { el.innerHTML = ''; return; }
  el.innerHTML = todos.map(td => `
    <div class="flex items-center gap-3 bg-slate-900/40 px-4 py-3 rounded-xl border group cursor-pointer transition-all ${td.completed ? 'border-slate-700/10' : 'border-slate-700/20 hover:border-orange-500/30'}" id="todo-row-${td.id}" onclick="toggleTodo(${taskId},${td.id},${!td.completed})">
      <div class="w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center transition-all ${td.completed ? 'bg-orange-500' : 'border-2 border-slate-600 group-hover:border-orange-500'}">
        ${td.completed ? '<span class="ms ms-xs text-white" style="font-size:12px">check</span>' : ''}
      </div>
      <span class="text-sm flex-1 leading-snug ${td.completed ? 'line-through text-slate-600' : 'text-slate-300'}">${esc(td.title)}</span>
      <button type="button" class="opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0 ms ms-xs text-slate-500 hover:text-red-400"
        onclick="event.stopPropagation();deleteTodo(${taskId},${td.id})">close</button>
    </div>`).join('');
}

async function addTodo(taskId) {
  const inp = document.getElementById('new-todo-inp');
  if (!inp || !inp.value.trim()) return;
  const title = inp.value.trim();
  try {
    await POST(`/tasks/${taskId}/todos`, {title});
    inp.value = '';
    const todos = await GET(`/tasks/${taskId}/todos`);
    renderTodos(taskId, todos);
    const task = S.tasks.find(t => t.id === taskId);
    if (task) { task.todos_total = todos.length; task.todos_completed = todos.filter(t=>t.completed).length; render(); }
  } catch(e) { toast(e.message, 'err'); }
}

async function toggleTodo(taskId, todoId, completed) {
  try {
    await PATCH(`/tasks/${taskId}/todos/${todoId}`, {completed});
    const todos = await GET(`/tasks/${taskId}/todos`);
    renderTodos(taskId, todos);
    const task = S.tasks.find(t => t.id === taskId);
    if (task) { task.todos_total = todos.length; task.todos_completed = todos.filter(t=>t.completed).length; render(); }
  } catch(e) { toast(e.message, 'err'); }
}

async function deleteTodo(taskId, todoId) {
  try {
    await req('DELETE', `/tasks/${taskId}/todos/${todoId}`);
    const todos = await GET(`/tasks/${taskId}/todos`);
    renderTodos(taskId, todos);
    const task = S.tasks.find(t => t.id === taskId);
    if (task) { task.todos_total = todos.length; task.todos_completed = todos.filter(t=>t.completed).length; render(); }
  } catch(e) { toast(e.message, 'err'); }
}

// ── Drag and drop ─────────────────────────────────
let _dragTaskId = null, _dragSrcGroupId = null, _dropTarget = null;

function onTaskDragStart(e, taskId, groupId) {
  _dragTaskId = taskId;
  _dragSrcGroupId = groupId;
  _dropTarget = null;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.classList.add('dragging'), 0);
}

function onTaskDragEnd(e) {
  _dragTaskId = null; _dragSrcGroupId = null; _dropTarget = null;
  e.target.classList.remove('dragging');
  document.querySelectorAll('.col-drop-active').forEach(el => el.classList.remove('col-drop-active'));
  document.querySelectorAll('.drop-before,.drop-after').forEach(el => el.classList.remove('drop-before','drop-after'));
}

function onCardDragOver(e, taskId) {
  e.preventDefault();
  const rect = e.currentTarget.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  document.querySelectorAll('.drop-before,.drop-after').forEach(el => el.classList.remove('drop-before','drop-after'));
  e.currentTarget.classList.toggle('drop-before', before);
  e.currentTarget.classList.toggle('drop-after', !before);
  _dropTarget = {taskId, before};
  e.dataTransfer.dropEffect = 'move';
}

function onCardDragLeave(e, taskId) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drop-before','drop-after');
    if (_dropTarget?.taskId === taskId) _dropTarget = null;
  }
}

function onColDragOver(e, groupId) {
  if (!_dragTaskId) return; // column reorder drag — let it bubble to outer k-col
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById('col-' + groupId).classList.add('col-drop-active');
}

function onColDragLeave(e, groupId) {
  const col = document.getElementById('col-' + groupId);
  if (!col.contains(e.relatedTarget)) col.classList.remove('col-drop-active');
}

async function onColDrop(e, targetGroupId) {
  if (!_dragTaskId) return; // let column reorder drop bubble to outer k-col
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('col-' + targetGroupId).classList.remove('col-drop-active');
  document.querySelectorAll('.drop-before,.drop-after').forEach(el => el.classList.remove('drop-before','drop-after'));
  const taskId = _dragTaskId;
  const srcGroupId = _dragSrcGroupId;
  const dropTarget = _dropTarget;
  _dragTaskId = null; _dragSrcGroupId = null; _dropTarget = null;

  if (srcGroupId === targetGroupId) {
    // Within-column reorder
    const tasks = S.tasks.filter(t => t.group_id === targetGroupId).sort((a,b) => (a.sort_order??0)-(b.sort_order??0)||a.id-b.id);
    const ids = tasks.map(t => t.id).filter(id => id !== taskId);
    if (!dropTarget) {
      ids.push(taskId);
    } else {
      const idx = ids.indexOf(dropTarget.taskId);
      if (idx === -1) { ids.push(taskId); }
      else if (dropTarget.before) { ids.splice(idx, 0, taskId); }
      else { ids.splice(idx + 1, 0, taskId); }
    }
    const origIds = tasks.map(t => t.id);
    if (JSON.stringify(ids) === JSON.stringify(origIds)) return;
    try {
      await PATCH('/groups/' + targetGroupId + '/tasks/reorder', {task_ids: ids});
      await loadAll(); render();
    } catch(err) { toast(err.message, 'err'); }
  } else {
    // Cross-column move
    try {
      await PATCH('/tasks/' + taskId, {group_id: targetGroupId});
      await loadAll(); render(); toast('Tarea movida');
    } catch(err) { toast(err.message, 'err'); }
  }
}

// ── Column reorder DnD ────────────────────────────
let _dragGroupId = null;

function onColHeaderDragStart(e, groupId) {
  _dragGroupId = groupId;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.currentTarget.classList.add('col-dragging'), 0);
}

function onColHeaderDragEnd(e) {
  _dragGroupId = null;
  e.currentTarget.classList.remove('col-dragging');
  document.querySelectorAll('.col-reorder-before,.col-reorder-after').forEach(el => el.classList.remove('col-reorder-before','col-reorder-after'));
}

function onColReorderDragOver(e, groupId) {
  if (!_dragGroupId || _dragGroupId === groupId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const rect = e.currentTarget.getBoundingClientRect();
  const before = e.clientX < rect.left + rect.width / 2;
  document.querySelectorAll('.col-reorder-before,.col-reorder-after').forEach(el => el.classList.remove('col-reorder-before','col-reorder-after'));
  e.currentTarget.classList.toggle('col-reorder-before', before);
  e.currentTarget.classList.toggle('col-reorder-after', !before);
}

function onColReorderDragLeave(e, groupId) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('col-reorder-before','col-reorder-after');
  }
}

async function onColReorderDrop(e, targetGroupId) {
  if (!_dragGroupId || _dragGroupId === targetGroupId) return;
  e.preventDefault();
  const rect = e.currentTarget.getBoundingClientRect();
  const before = e.clientX < rect.left + rect.width / 2;
  document.querySelectorAll('.col-reorder-before,.col-reorder-after').forEach(el => el.classList.remove('col-reorder-before','col-reorder-after'));
  const srcGroupId = _dragGroupId;
  _dragGroupId = null;
  document.querySelectorAll('.col-dragging').forEach(el => el.classList.remove('col-dragging'));

  const cols = S.groups.filter(g => g.project_id === S.pid).sort((a,b) => (a.sort_order??0)-(b.sort_order??0)||a.id-b.id);
  const ids = cols.map(g => g.id).filter(id => id !== srcGroupId);
  const idx = ids.indexOf(targetGroupId);
  if (before) { ids.splice(idx, 0, srcGroupId); }
  else { ids.splice(idx + 1, 0, srcGroupId); }

  try {
    await PATCH('/groups/reorder', {project_id: S.pid, group_ids: ids});
    await loadAll(); render();
  } catch(err) { toast(err.message, 'err'); }
}

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function inits(n) { return n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function hashCol(n) {
  const cs=['#F97316','#EF4444','#8B5CF6','#3B82F6','#10B981','#F59E0B','#EC4899','#14B8A6'];
  let h=0; for (const c of n) h=((h<<5)-h)+c.charCodeAt(0);
  return cs[Math.abs(h)%cs.length];
}
function avatar(r, size) {
  const sz = size==='sm' ? 'width:22px;height:22px;font-size:9px' : 'width:30px;height:30px;font-size:11px';
  const bd = 'border:1.5px solid rgba(249,115,22,.25);border-radius:50%;object-fit:cover;flex-shrink:0';
  if (r.avatar_url) return `<img src="${esc(r.avatar_url)}" style="${sz};${bd}" title="${esc(r.name)}">`;
  return `<div style="${sz};${bd};background:${hashCol(r.name)};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff" title="${esc(r.name)}">${inits(r.name)}</div>`;
}
function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span class="ms ms-sm">${type==='ok'?'check_circle':'error'}</span>${esc(msg)}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}
